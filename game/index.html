<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Port Azahar - GTA 6 Style Open World Crime Game</title>
  <link rel="icon" href="data:,">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    #game-container {
      position: relative;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    canvas {
      display: block;
      background: #1a2332;
      cursor: crosshair;
    }
    #status {
      position: absolute;
      left: -9999px;
      top: auto;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <div id="status" aria-live="polite"></div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
